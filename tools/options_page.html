<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFSU Player Options</title>
<style>
  :root {
    --bg: #eef1f6; --card: #ffffff; --ink: #18202c; --muted: #5b6676; --line: #d6dce6;
    --accent: #e8590c; --accent-ink: #ffffff; --accent-soft: #fde7da; --field: #f7f9fc; --bad: #c92a2a;
    --code: #f3f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e131b; --card: #171e29; --ink: #e6ebf2; --muted: #93a0b2; --line: #2a3442;
      --accent: #ff8a3d; --accent-ink: #1a0d03; --accent-soft: #3a2415; --field: #10161f; --bad: #ff6b6b;
      --code: #10161f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e131b; --card: #171e29; --ink: #e6ebf2; --muted: #93a0b2; --line: #2a3442;
    --accent: #ff8a3d; --accent-ink: #1a0d03; --accent-soft: #3a2415; --field: #10161f; --bad: #ff6b6b;
    --code: #10161f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 120px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-top: 16px; }
  .card > summary, .card > h2 { list-style: none; cursor: pointer; margin: 0; padding: 14px 18px;
         font-size: 17px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .card > h2 { cursor: default; }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  .card[open] > summary::before { transform: rotate(90deg); }
  .body { padding: 0 18px 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .opt { padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
  .opt-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .opt label.name { font-weight: 560; }
  .help { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 50%;
          width: 22px; height: 22px; font-size: 12px; cursor: pointer; flex: none; }
  .help[aria-expanded="true"] { background: var(--accent-soft); color: var(--ink); }
  .doc { white-space: pre-line; color: var(--muted); font-size: 13.5px; margin: 6px 0 2px; display: none; }
  .doc.show { display: block; }
  .ctrl { margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=text], input[type=number], input[type=search] {
    font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 9px; min-width: 0; }
  select { flex: 1 1 160px; }
  input[type=number] { width: 88px; }
  input[type=range] { flex: 1 1 140px; accent-color: var(--accent); min-width: 0; }
  input[type=checkbox] { accent-color: var(--accent); }
  .rand { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px;
          padding: 3px 10px; font-size: 13.5px; cursor: pointer; background: var(--field); }
  .chip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
  .player { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .player { grid-template-columns: 1fr; } }
  .player label { display: block; font-weight: 560; margin-bottom: 4px; }
  .player input, .player select { width: 100%; }
  .err { color: var(--bad); font-size: 13px; min-height: 1em; margin-top: 3px; }
  .list { border-top: 1px solid var(--line); padding: 10px 0; }
  .list h3 { margin: 0 0 2px; font-size: 15px; }
  .list .count { color: var(--muted); font-weight: 400; }
  .list .tools { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .list .tools input { flex: 1 1 200px; }
  .entries { max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: 8px;
             padding: 6px 10px; background: var(--field); }
  .entry { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-size: 14px; }
  .entry.group { font-weight: 600; }
  .entry input[type=number] { width: 64px; padding: 2px 6px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); }
  .bar .in { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center;
             flex-wrap: wrap; }
  .bar .status { color: var(--muted); font-size: 13.5px; margin-right: auto; }
  button.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; cursor: pointer;
               border: 1px solid var(--line); background: var(--field); color: var(--ink); }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  pre { margin: 0; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px;
        overflow: auto; font: 13px/1.45 ui-monospace, Consolas, monospace; max-height: 420px; }
  .note { color: var(--muted); font-size: 13.5px; margin: 0 0 8px; }
  .opt.changed { box-shadow: inset 3px 0 0 var(--accent); padding-left: 10px; }
  .opt.changed label.name::after { content: " · changed"; color: var(--accent); font-weight: 500; font-size: 12.5px; }
  #presetNote { margin: 6px 0 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Need for Speed: Underground</h1>
    <p id="sub">Player options</p>
  </header>

  <section class="card">
    <h2>Player</h2>
    <div class="body player">
      <div>
        <label for="pname">Player name</label>
        <input id="pname" type="text" maxlength="16" placeholder="max. 16 characters" autocomplete="off">
        <div class="err" id="nameErr"></div>
      </div>
      <div>
        <label for="pdesc">Description</label>
        <input id="pdesc" type="text" placeholder="optional">
      </div>
      <div>
        <label for="preset">Preset</label>
        <select id="preset"></select>
      </div>
      <p class="note" id="presetNote" style="grid-column: 1 / -1"></p>
    </div>
  </section>

  <div id="groups"></div>

  <details class="card" id="lists">
    <summary>Item &amp; Location Options</summary>
    <div class="body">
      <p class="note">Optional. Names in bold are groups.</p>
      <div id="listBody"></div>
    </div>
  </details>

  <details class="card">
    <summary>YAML preview</summary>
    <div class="body"><pre id="preview"></pre></div>
  </details>
</main>

<div class="bar"><div class="in">
  <span class="status" id="status"></span>
  <button class="btn" id="reset" type="button">Reset</button>
  <button class="btn" id="copy" type="button">Copy YAML</button>
  <button class="btn primary" id="download" type="button">Download YAML</button>
</div></div>

<script id="data" type="application/json">/*OPTIONS_DATA*/{}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var OPTIONS = {};
  DATA.groups.forEach(function (g) { g.options.forEach(function (o) { OPTIONS[o.key] = o; }); });
  var values = {}, lists = {};
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k];
      else if (k === "class") e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  // ------------------------------------------------------------------ state
  function defaults() {
    values = {};
    Object.keys(OPTIONS).forEach(function (k) {
      var o = OPTIONS[k];
      values[k] = o.kind === "set" ? o.default.slice() : o.default;
    });
    lists = {};
    DATA.lists.forEach(function (l) { lists[l.key] = l.kind === "counts" ? {} : []; });
  }

  function applyPreset(name) {
    defaults();
    var p = DATA.presets[name] || {};
    Object.keys(p).forEach(function (k) {
      if (!(k in OPTIONS)) return;
      var o = OPTIONS[k], v = p[k];
      if (o.kind === "toggle") values[k] = v === "random" ? "random" : !!v;
      else if (o.kind === "range" && typeof v === "string" && v in o.named) values[k] = o.named[v];
      else values[k] = v;
    });
  }

  // ------------------------------------------------------------------ option controls
  var renderers = {
    toggle: function (o) {
      var s = el("select", {id: "opt-" + o.key});
      [["true", "On"], ["false", "Off"], ["random", "Random"]].forEach(function (p) {
        s.appendChild(el("option", {value: p[0], text: p[1]}));
      });
      s.value = String(values[o.key]);
      s.addEventListener("change", function () {
        values[o.key] = s.value === "random" ? "random" : s.value === "true"; update();
      });
      return [s];
    },
    choice: function (o) {
      var s = el("select", {id: "opt-" + o.key});
      // AP's generic "random" picks any choice; options with their own random_* choices don't need it
      var own = o.choices.some(function (c) { return c.indexOf("random") === 0; });
      (own ? o.choices : o.choices.concat(["random"])).forEach(function (c) { s.appendChild(el("option", {value: c, text: c})); });
      s.value = values[o.key];
      s.addEventListener("change", function () { values[o.key] = s.value; update(); });
      return [s];
    },
    range: function (o) {
      var r = el("input", {type: "range", min: o.min, max: o.max, step: 1, id: "opt-" + o.key});
      var n = el("input", {type: "number", min: o.min, max: o.max, step: 1, "aria-label": o.name});
      var named = Object.keys(o.named);
      var sel = null;
      if (named.length) {
        sel = el("select", {"aria-label": o.name + " preset"});
        sel.appendChild(el("option", {value: "", text: "custom"}));
        named.forEach(function (k) { sel.appendChild(el("option", {value: k, text: k + " (" + o.named[k] + ")"})); });
      }
      var cb = el("input", {type: "checkbox"});
      var rand = el("label", {class: "rand"}, [cb, document.createTextNode("Random")]);
      function show() {
        var v = values[o.key], isRand = v === "random";
        cb.checked = isRand; r.disabled = n.disabled = isRand;
        if (sel) sel.disabled = isRand;
        if (!isRand) { r.value = v; n.value = v; }
        if (sel) {
          var match = named.filter(function (k) { return o.named[k] === v; })[0];
          sel.value = match || "";
        }
      }
      function set(v) {
        v = Math.round(Number(v));
        if (isNaN(v)) return;
        values[o.key] = Math.min(o.max, Math.max(o.min, v)); show(); update();
      }
      r.addEventListener("input", function () { set(r.value); });
      n.addEventListener("change", function () { set(n.value); });
      if (sel) sel.addEventListener("change", function () { if (sel.value) set(o.named[sel.value]); });
      cb.addEventListener("change", function () {
        values[o.key] = cb.checked ? "random" : o.default; show(); update();
      });
      show();
      return [r, n, sel, rand];
    },
    set: function (o) {
      var box = el("div", {class: "chips"});
      o.valid.forEach(function (v) {
        var c = el("input", {type: "checkbox", value: v});
        c.checked = values[o.key].indexOf(v) >= 0;
        c.addEventListener("change", function () {
          var cur = values[o.key].filter(function (x) { return x !== v; });
          if (c.checked) cur.push(v);
          values[o.key] = o.valid.filter(function (x) { return cur.indexOf(x) >= 0; });
          update();
        });
        box.appendChild(el("label", {class: "chip"}, [c, document.createTextNode(v)]));
      });
      return [box];
    }
  };

  function renderGroups() {
    var root = $("groups");
    root.textContent = "";
    DATA.groups.forEach(function (g) {
      var grid = el("div", {class: "grid"});
      g.options.forEach(function (o) {
        var doc = el("div", {class: "doc", id: "doc-" + o.key, text: o.doc});
        var help = el("button", {class: "help", type: "button", "aria-expanded": "false",
                                 "aria-controls": "doc-" + o.key, title: "Show description", text: "?"});
        help.addEventListener("click", function () {
          var open = doc.classList.toggle("show");
          help.setAttribute("aria-expanded", String(open));
        });
        var head = el("div", {class: "opt-head"}, [el("label", {class: "name", for: "opt-" + o.key, text: o.name}), help]);
        grid.appendChild(el("div", {class: "opt", id: "row-" + o.key}, [head, doc, el("div", {class: "ctrl"}, renderers[o.kind](o))]));
      });
      var card = el("details", {class: "card"}, [el("summary", {text: g.name}), el("div", {class: "body"}, [grid])]);
      card.open = g.name !== "Death Link";
      root.appendChild(card);
    });
  }

  // ------------------------------------------------------------------ item & location lists
  function renderLists() {
    var root = $("listBody");
    root.textContent = "";
    DATA.lists.forEach(function (l) {
      var isItems = l.kind !== "locations";
      var names = isItems ? DATA.items : DATA.locations;
      var groups = l.kind === "counts" ? [] : (isItems ? DATA.item_groups : DATA.location_groups);
      var count = el("span", {class: "count"});
      var search = el("input", {type: "search", placeholder: "Filter…", "aria-label": "Filter " + l.name});
      var clear = el("button", {class: "btn", type: "button", text: "Clear"});
      var entries = el("div", {class: "entries"});
      var rows = [];
      function refreshCount() {
        var v = lists[l.key];
        var n = l.kind === "counts" ? Object.keys(v).length : v.length;
        count.textContent = n ? " – " + n + " selected" : "";
      }
      groups.map(function (g) { return [g, true]; }).concat(names.map(function (n) { return [n, false]; }))
        .forEach(function (pair) {
          var name = pair[0], input;
          if (l.kind === "counts") {
            input = el("input", {type: "number", min: 0, max: 999, value: 0, "aria-label": name});
            input.addEventListener("change", function () {
              var v = Math.max(0, Math.round(Number(input.value) || 0));
              input.value = v;
              if (v) lists[l.key][name] = v; else delete lists[l.key][name];
              refreshCount(); update();
            });
          } else {
            input = el("input", {type: "checkbox"});
            input.addEventListener("change", function () {
              var cur = lists[l.key].filter(function (x) { return x !== name; });
              if (input.checked) cur.push(name);
              lists[l.key] = cur; refreshCount(); update();
            });
          }
          var row = el("label", {class: "entry" + (pair[1] ? " group" : "")}, [input, document.createTextNode(name)]);
          row.dataset.name = name.toLowerCase();
          rows.push({row: row, input: input, name: name});
          entries.appendChild(row);
        });
      search.addEventListener("input", function () {
        var q = search.value.trim().toLowerCase();
        rows.forEach(function (r) { r.row.style.display = !q || r.row.dataset.name.indexOf(q) >= 0 ? "" : "none"; });
      });
      clear.addEventListener("click", function () {
        lists[l.key] = l.kind === "counts" ? {} : [];
        rows.forEach(function (r) { if (r.input.type === "checkbox") r.input.checked = false; else r.input.value = 0; });
        refreshCount(); update();
      });
      root.appendChild(el("div", {class: "list"}, [
        el("h3", {}, [document.createTextNode(l.name), count]),
        el("div", {class: "doc show", text: l.doc}),
        el("div", {class: "tools"}, [search, clear]),
        entries
      ]));
      refreshCount();
    });
  }

  // ------------------------------------------------------------------ YAML
  function q(s) { return JSON.stringify(String(s)); }

  function yaml() {
    var name = $("pname").value.trim(), desc = $("pdesc").value.trim();
    var out = [
      "# " + DATA.game + " – created with the NFSU options page (world " + DATA.world_version + ")",
      "name: " + q(name || "Player"),
      "description: " + q(desc || "NFSU options"),
      "game: " + DATA.game,
      "requires:",
      "  version: " + DATA.ap_version,
      "",
      DATA.game + ":"
    ];
    DATA.groups.forEach(function (g) {
      out.push("  # " + g.name);
      g.options.forEach(function (o) {
        var v = values[o.key];
        if (o.kind === "set") v = "[" + v.map(q).join(", ") + "]";
        out.push("  " + o.key + ": " + v);
      });
    });
    var extra = DATA.lists.filter(function (l) {
      var v = lists[l.key];
      return l.kind === "counts" ? Object.keys(v).length : v.length;
    });
    if (extra.length) out.push("  # Item & Location Options");
    extra.forEach(function (l) {
      var v = lists[l.key];
      if (l.kind === "counts") {
        out.push("  " + l.key + ":");
        Object.keys(v).sort().forEach(function (k) { out.push("    " + q(k) + ": " + v[k]); });
      } else {
        out.push("  " + l.key + ": [" + v.slice().sort().map(q).join(", ") + "]");
      }
    });
    return out.join("\n") + "\n";
  }

  function nameError() {
    var n = $("pname").value.trim();
    if (!n) return "Enter your slot name.";
    if (n.length > 16) return "At most 16 characters.";
    return "";
  }

  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  function showChanges() {
    var changed = [];
    Object.keys(OPTIONS).forEach(function (k) {
      var o = OPTIONS[k], diff = !same(values[k], o.default);
      var row = $("row-" + k);
      if (row) row.classList.toggle("changed", diff);
      if (diff) changed.push(o.name + ": " + (o.kind === "set" ? (values[k].join(", ") || "none") :
                                                 o.kind === "toggle" && values[k] !== "random" ? (values[k] ? "on" : "off") : values[k]));
    });
    $("presetNote").textContent = changed.length
      ? "Changed from the defaults (marked below): " + changed.join(" · ")
      : "All options are at their defaults.";
  }

  function update() {
    showChanges();
    var err = nameError();
    $("nameErr").textContent = $("pname").dataset.touched ? err : "";
    $("download").disabled = $("copy").disabled = !!err;
    $("status").textContent = err ? "Enter a player name to export." : "Ready: " + $("pname").value.trim() + ".yaml";
    $("preview").textContent = yaml();
  }

  function fileName() {
    return ($("pname").value.trim().replace(/[^\w\- ]+/g, "_") || "Player") + ".yaml";
  }

  // ------------------------------------------------------------------ wiring
  $("sub").textContent = "Player options · world " + DATA.world_version + " · Archipelago " + DATA.ap_version +
                         " – choose your options and download the YAML for the multiworld host.";
  var preset = $("preset");
  var START = "Standard" in DATA.presets ? "Standard" : "";
  if (!START) preset.appendChild(el("option", {value: "", text: "Defaults"}));
  Object.keys(DATA.presets).forEach(function (p) { preset.appendChild(el("option", {value: p, text: p})); });
  preset.value = START;
  preset.addEventListener("change", function () { applyPreset(preset.value); renderGroups(); renderLists(); update(); });
  $("pname").addEventListener("input", function () { $("pname").dataset.touched = "1"; update(); });
  $("pdesc").addEventListener("input", update);
  $("reset").addEventListener("click", function () { preset.value = START; applyPreset(START); renderGroups(); renderLists(); update(); });
  $("download").addEventListener("click", function () {
    if (nameError()) return;
    var a = el("a", {href: URL.createObjectURL(new Blob([yaml()], {type: "text/yaml"})), download: fileName()});
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  });
  $("copy").addEventListener("click", function () {
    if (nameError()) return;
    var done = function () { $("status").textContent = "YAML copied to the clipboard."; };
    if (navigator.clipboard) navigator.clipboard.writeText(yaml()).then(done, function () { fallbackCopy(); done(); });
    else { fallbackCopy(); done(); }
  });
  function fallbackCopy() {
    var t = el("textarea", {}); t.value = yaml(); document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (e) { /* ignore */ }
    t.remove();
  }

  applyPreset(START);
  renderGroups();
  renderLists();
  update();
})();
</script>
</body>
</html>
