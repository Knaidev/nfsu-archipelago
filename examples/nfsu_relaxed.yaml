# Need for Speed: Underground – "Relaxed" preset
name: NFSU_Relaxed
description: Loose logic, lower star gates, more Bank
game: Need for Speed Underground
requires:
  version: 0.6.8

Need for Speed Underground:
  goal: finale
  logic_strictness: loose
  star_gate_scale: 75        # finale needs 3 stars instead of 5
  starting_event_packs: 4
  bank_multiplier: 200
  starting_bank: 5000
